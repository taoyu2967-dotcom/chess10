    ? `θ*=${D.meta.ref} · Li et al. 2018 逐滤波归一化随机方向切片 · 网格 ${D.betas.length}×${D.alphas.length} · ${D.meta.samples} 样本 · ${D.meta.lossDef}`
    : `A=${D.meta.snapA}（α=0）→ B=${D.meta.snapB}（α=1） · 网格 ${D.betas.length}×${D.alphas.length} · ${D.meta.samples} 样本 · ${D.meta.lossDef}`;
  if (KIND === 'li') {
    const rows = (D.sharpness || []).map(s => `r=${s.r}: 平均+${Number(s.mean).toFixed(1)} / 峰值+${Number(s.max).toFixed(1)}`).join('<br>');
    document.getElementById('hudBody').innerHTML =
      `<b>方法</b>：Li et al. 2018（归一化层不扰动）<br>` +
      `<b>中心 θ*</b>=切片损失极小（蓝球）<br>` +
      `<b>切片特征</b>：绿=局部极小 · 橙=鞍点候选 · 红=局部极大<br>` +
      `<b>锐度（离中心损失增量）</b>：<br>${rows}<br>` +
      `<span style="color:#6a7a88">注：2.8M 维空间的驻点不可见于 2D 切片；此处为切片局部特征</span>`;
  } else {
    document.getElementById('hudBody').innerHTML =
      `<b>绿色轨迹线</b>：训练真实路径（β=0 截面，A→B）<br>` +
      `<b>球标记</b>：A=起点快照 · B=终点快照 · 谷底=损失最低点`;
  }

  const G = D.gridTotal, al = D.alphas, be = D.betas;
  // null（溢出区）填充：Li 版用 gMax 立墙呈现悬崖；插值版沿用行末延伸
  let gMin = Infinity, gMax = -Infinity;
  for (const row of G) for (const v of row) { if (v == null) continue; gMin = Math.min(gMin, v); gMax = Math.max(gMax, v); }
  for (let j = 0; j < G.length; j++) {
    let last = G[j][0];
    for (let i = 0; i < G[j].length; i++) {
      if (G[j][i] == null) G[j][i] = KIND === 'li' ? gMax : last; else last = G[j][i];
    }
  }
  const span = gMax - gMin || 1;

  // 双线性细化 3×（121×75 网格，视觉平滑）
  const SUB = 3, NA = (al.length - 1) * SUB + 1, NB = (be.length - 1) * SUB + 1;
  function sample(a01, b01) {   // a01/b01 ∈ [0,1]
    const fa = a01 * (al.length - 1), fb = b01 * (be.length - 1);
    const ia = Math.min(al.length - 2, fa | 0), ib = Math.min(be.length - 2, fb | 0);
    const ta = fa - ia, tb = fb - ib;
    const v00 = G[ib][ia], v01 = G[ib][ia + 1], v10 = G[ib + 1][ia], v11 = G[ib + 1][ia + 1];
    return (v00 * (1 - ta) + v01 * ta) * (1 - tb) + (v10 * (1 - ta) + v11 * ta) * tb;
  }
  function cmap(v) {
    const t = Math.max(0, Math.min(1, (v - gMin) / span));
    const stops = [[15,30,90],[32,120,160],[80,190,140],[230,200,80],[220,80,60]];
    const s = t * (stops.length - 1), i = Math.min(stops.length - 2, s | 0), f = s - i;
    const c0 = stops[i], c1 = stops[i + 1];
    return [c0[0] + (c1[0] - c0[0]) * f, c0[1] + (c1[1] - c0[1]) * f, c0[2] + (c1[2] - c0[2]) * f];
  }

  // ---------- 场景 ----------
  const W = () => document.getElementById('view').clientWidth, H = () => document.getElementById('view').clientHeight;
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(W(), H());
  document.getElementById('view').appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0b0f14);
  scene.fog = new THREE.Fog(0x0b0f14, 80, 260);
  const camera = new THREE.PerspectiveCamera(50, W() / H(), 0.1, 1000);
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.08;
  controls.autoRotate = true; controls.autoRotateSpeed = 1.1;

  // 尺寸映射：x=α ∈ [-60,60]，z=β ∈ [-40,40]，y=损失高度 [0,42]
  const SX = 120, SZ = 80, SY = 42;
  const X = a01 => (a01 - 0.5) * SX;
  const Z = b01 => (b01 - 0.5) * SZ;
  const Y = v => (v - gMin) / span * SY;

  // 表面网格
  const geo = new THREE.PlaneGeometry(SX, SZ, NA - 1, NB - 1);
  geo.rotateX(-Math.PI / 2);   // 平面躺平：x→x, 原y→z
  const pos = geo.attributes.position;
  const colors = new Float32Array(pos.count * 3);
  let k = 0;
  for (let jb = 0; jb < NB; jb++) {
    for (let ia = 0; ia < NA; ia++) {
      const a01 = ia / (NA - 1), b01 = jb / (NB - 1);
      const v = sample(a01, b01);
      pos.setZ(k, -Z(b01));          // PlaneGeometry 的行序对应 -z 方向
      pos.setY(k, Y(v));
      const [r, g, b] = cmap(v);
      colors[k * 3] = r / 255; colors[k * 3 + 1] = g / 255; colors[k * 3 + 2] = b / 255;
      k++;
    }
  }
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geo.computeVertexNormals();
  const mat = new THREE.MeshPhongMaterial({ vertexColors: true, shininess: 55, specular: 0x333333, side: THREE.DoubleSide });
  const surf = new THREE.Mesh(geo, mat);
  scene.add(surf);
  const wire = new THREE.Mesh(geo.clone(), new THREE.MeshBasicMaterial({ color: 0x4fd1a5, wireframe: true, transparent: true, opacity: 0.0 }));
  scene.add(wire);

  // 光照
  scene.add(new THREE.AmbientLight(0xffffff, 0.55));
  const dl = new THREE.DirectionalLight(0xffffff, 0.65); dl.position.set(60, 90, 40); scene.add(dl);
  const dl2 = new THREE.DirectionalLight(0x88aaff, 0.25); dl2.position.set(-50, 40, -60); scene.add(dl2);

  // 训练轨迹线（仅插值版：β=0 截面沿 α 扫描）
  if (KIND !== 'li') {
    const trajPts = D.curve.map(p => new THREE.Vector3(X((p.a - al[0]) / (al[al.length - 1] - al[0])), Y(p.total) + 0.35, 0));
    const trajGeo = new THREE.BufferGeometry().setFromPoints(trajPts);
    scene.add(new THREE.Line(trajGeo, new THREE.LineBasicMaterial({ color: 0x4fd1a5, linewidth: 2 })));
    // 轨迹投影阴影线（贴地）
    const shadowPts = trajPts.map(p => new THREE.Vector3(p.x, 0.05, p.z));
    scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(shadowPts), new THREE.LineBasicMaterial({ color: 0x2a5a4a, transparent: true, opacity: 0.7 })));
  }

  // 标记球（通用）：任意 (a01,b01) 落点
  function markerAt(a01, b01, color, label, lift = 0.4) {
    const v = sample(a01, b01);
    const g = new THREE.SphereGeometry(1.35, 20, 20);
    const m = new THREE.Mesh(g, new THREE.MeshPhongMaterial({ color, emissive: color, emissiveIntensity: 0.45 }));
    m.position.set(X(a01), Y(v) + lift, (0.5 - b01) * SZ);
    scene.add(m);
    const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: makeLabel(label, color), transparent: true }));
    sprite.scale.set(11, 5.5, 1);
    sprite.position.set(m.position.x, m.position.y + 5, m.position.z);
    scene.add(sprite);
    return m;
  }
  function makeLabel(text, color) {
    const cv = document.createElement('canvas'); cv.width = 256; cv.height = 128;
    const ctx = cv.getContext('2d');
    ctx.font = 'bold 64px "Segoe UI", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor = '#000'; ctx.shadowBlur = 10;
    ctx.fillStyle = '#' + new THREE.Color(color).getHexString();
    ctx.fillText(text, 128, 64);
    const t = new THREE.CanvasTexture(cv); return t;
  }
  const a0 = (0 - al[0]) / (al[al.length - 1] - al[0]);
  const a1 = (1 - al[0]) / (al[al.length - 1] - al[0]);
  const minP = D.curve ? D.curve.reduce((m, p) => p.total < m.total ? p : m, D.curve[0]) : null;
  const am = minP ? (minP.a - al[0]) / (al[al.length - 1] - al[0]) : 0;
  if (KIND === 'li') {
    // θ* 中心 + 切片局部特征标注（min=绿 / saddle=橙 / max=红）
    markerAt(0.5, 0.5, 0x5aa7e8, 'θ*=' + D.meta.ref + ' (切片极小)');
    const A2 = (a) => (a - al[0]) / (al[al.length - 1] - al[0]);
    const B2 = (b) => (b - be[0]) / (be[be.length - 1] - be[0]);
    const COLS = { min: 0x4fd1a5, saddle: 0xe8963c, max: 0xe85a4a };
    for (const an of (D.annotations || [])) {
      if (an.type === 'min' && Math.abs(an.a) < 1e-6 && Math.abs(an.b) < 1e-6) continue;  // 中心已标
      markerAt(A2(an.a), B2(an.b), COLS[an.type], an.type + ' ' + an.a.toFixed(2) + ',' + an.b.toFixed(2));
    }
  } else {
    markerAt(a0, 0.5, 0x5aa7e8, 'A=' + D.meta.snapA);
    markerAt(a1, 0.5, 0xe86a5a, 'B=' + D.meta.snapB);
    markerAt(am, 0.5, 0xf0d060, '谷底 α=' + minP.a);
  }

  // 底座网格
  const grid = new THREE.GridHelper(Math.max(SX, SZ) * 1.15, 24, 0x223038, 0x182128);
  grid.position.y = -0.05; scene.add(grid);

  // 相机初始视角
  function resetCam() {
    camera.position.set(78, 62, 92);
    camera.lookAt(0, 12, 0);
    controls.target.set(0, 12, 0);
  }
  resetCam();

  // 按钮交互
  let wireOn = false, rotateOn = true;
  document.getElementById('btnWire').onclick = () => {
    wireOn = !wireOn;
    wire.material.opacity = wireOn ? 0.35 : 0.0;
    mat.opacity = wireOn ? 0.35 : 1.0; mat.transparent = wireOn;
  };
  document.getElementById('btnRotate').onclick = (e) => {
    rotateOn = !rotateOn; controls.autoRotate = rotateOn;
    e.target.textContent = rotateOn ? '自动旋转' : '已暂停';
  };
  document.getElementById('btnReset').onclick = resetCam;

  window.addEventListener('resize', () => {
    camera.aspect = W() / H(); camera.updateProjectionMatrix();
    renderer.setSize(W(), H());
  });

  (function loop() { requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera); })();
  window.__renderOK = { tris: geo.attributes.position.count / 3 | 0 };
})();
</script>
</body>
</html>
